[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "bt-emu-mcp"
version = "0.1.0"
description = "MCP server: a virtual Bluetooth lab (Bumble) for testing Bluetooth software without hardware or radio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bumble>=0.0.220",
    "mcp>=1.28,<2",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
bt-emu-mcp = "bt_emu_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["bt_emu_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "bt_emu_mcp/profiles"

[tool.hatch.build.targets.sdist]
include = ["bt_emu_mcp", "profiles", "tests", "systemd", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
