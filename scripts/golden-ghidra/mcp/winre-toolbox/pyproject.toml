[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "winre-toolbox-mcp"
version = "0.1.0"
description = "MCP server exposing Windows reverse-engineering CLIs (Sysinternals, DIE, capa, FLOSS, ilspycmd, procmon, tshark, pefile) as structured tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.28,<2", "pefile>=2023.2.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
winre-toolbox-mcp = "winre_toolbox_mcp.server:main"

[tool.setuptools]
packages = ["winre_toolbox_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
